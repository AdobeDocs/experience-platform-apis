              type: string
            imsOrg:
              type: string
        autoActivationSettings:
          type: array
          items:
            type: object
    MatchKeySetting:
      type: object
      properties:
        id:
          type: string
          description: The match key identifier.
          example: HASHED_EMAIL_SHA_256
        minimumCount:
          type: integer
          description: The minimum count configured for the match key.
          example: 10000
        settings:
          type: object
          description: Additional settings for the match key.
          additionalProperties: true
    Collaborator:
      type: object
      properties:
        id:
          type: string
          description: The collaborator's unique identifier.
        name:
          type: string
        description:
          type: string
        type:
          type: string
        useCases:
          type: array
          items:
            type: string
        matchKeySettings:
          type: array
          items:
            $ref: "#/components/schemas/MatchKeySetting"
        status:
          type: string
        imsOrg:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
      example:
        id: 6a90679d08cb6303653d7f38
        name: Example publisher
        description: A publisher collaborating on audiences.
        type: PUBLISHER
        useCases:
          - AUDIENCE_INSIGHTS
          - AUDIENCE_SHARING
          - AUDIENCE_ACTIVATION
          - MEASUREMENT
        matchKeySettings:
          - id: HASHED_EMAIL_SHA_256
            minimumCount: 10000
          - id: HASHED_PHONE_SHA_256
            minimumCount: 10000
        status: ACTIVE
        imsOrg: 1234567890ABCDEF12345678@AdobeOrg
        createdAt: 1787848605297
        updatedAt: 1787848605297
    Brand:
