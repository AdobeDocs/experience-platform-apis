          imsOrgId: 9876543210ABCDEF12345678@AdobeOrg
        grants:
          - audienceId: aud_loyalty
            population: OVERLAP
            receiverRight: QUERY
            sourceMode: REFERENCE
            expiresAt: 0
    Grant:
      allOf:
        - $ref: "#/components/schemas/GrantInfo"
        - type: object
          properties:
            grantId:
              type: string
              description: The grant's unique identifier.
            status:
              type: string
              description: The grant's status.
              enum:
                - ACTIVE
                - EXPIRED
                - PAUSED
                - REVOKED
                - DELETED
            collaboratorId:
              type: string
              description: The sender's collaborator ID.
            imsOrgId:
              type: string
              description: The sender's IMS organization ID.
            createdAt:
              type: integer
              format: int64
              description: The creation timestamp.
            updatedAt:
              type: integer
              format: int64
              description: The last update timestamp.
            createdBy:
              type: string
            updatedBy:
              type: string
            grantType:
              type: string
              enum:
                - AUDIENCE_GRANT
            scope:
              type: string
              enum:
                - CONNECTION
            receiverDetails:
              $ref: "#/components/schemas/GrantReceiver"
      example:
        grantId: grant_12345
        status: ACTIVE
        collaboratorId: col_dsg_root
        imsOrgId: 1234567890ABCDEF12345678@AdobeOrg
        createdAt: 1787848605297
        updatedAt: 1787848605297
        grantType: AUDIENCE_GRANT
        scope: CONNECTION
        audienceId: aud_loyalty
        receiverDetails:
          collaboratorId: col_nike
          imsOrgId: 9876543210ABCDEF12345678@AdobeOrg
        population: OVERLAP
        receiverRight: QUERY
        sourceMode: REFERENCE
        expiresAt: 0
    GrantList:
      type: object
      properties:
        items:
          type: array
          description: Grants issued by the collaborator.
          items:
            $ref: "#/components/schemas/Grant"
        next:
          type: string
          nullable: true
          description: The cursor for the next page.
        previous:
          type: string
          nullable: true
          description: The cursor for the previous page.
        limit:
          type: integer
          description: The page size.
      example:
        items:
          - grantId: grant_12345
            status: ACTIVE
            collaboratorId: col_dsg_root
            audienceId: aud_loyalty
            receiverDetails:
              collaboratorId: col_nike
              imsOrgId: 9876543210ABCDEF12345678@AdobeOrg
            population: OVERLAP
            receiverRight: QUERY
            sourceMode: REFERENCE
            expiresAt: 0
            createdAt: 1787848605297
            updatedAt: 1787848605297
        next: null
        previous: null
        limit: 20
    GrantPatchRequest:
      type: object
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/GrantPatchItem"
      example:
        grants:
          - grantId: grant_12345
            expiresAt: 1790000000000
    GrantPatchItem:
      type: object
      properties:
        grantId:
          type: string
        expiresAt:
          type: integer
          format: int64
        status:
          type: string
          description: Only `REVOKED` is currently supported.
          enum:
            - REVOKED
    ActivationSchedule:
      type: object
      description: The activation schedule.
      properties:
        startAtEpochMillis:
          type: integer
          format: int64
          description: The schedule start time in milliseconds since the Unix epoch.
        endAtEpochMillis:
          type: integer
          format: int64
          description: The schedule end time in milliseconds since the Unix epoch.
        frequency:
          type: string
          description: The scheduled execution frequency.
          enum:
            - ONCE
            - DAILY
            - EVERY_2_DAYS
            - EVERY_3_DAYS
            - EVERY_4_DAYS
            - EVERY_5_DAYS
            - EVERY_6_DAYS
            - EVERY_2_WEEKS
            - EVERY_3_WEEKS
            - MONTHLY
      example:
        startAtEpochMillis: 1756200000000
        endAtEpochMillis: 1788021405297
        frequency: DAILY
    CreateActivationRequest:
      type: object
      required:
        - audiences
        - matchKeys
      properties:
        destinationDataConnectionId:
          type: string
          description: The ID of an ACTIVE egress destination data connection.
        audiences:
          type: array
          minItems: 1
          description: The IDs of the owned or granted audiences to activate. At least one audience is required.
          items:
            type: string
        matchKeys:
          type: array
          minItems: 1
          description: At least one match key supported by the destination and audiences.
          items:
            type: string
        schedule:
          $ref: "#/components/schemas/ActivationSchedule"
      example:
        destinationDataConnectionId: 6a727838f3fe382e2f6ab527
        audiences:
          - 6a6cbe4dc6a6ce756938f8b2
          - 6a6cbe4dc6a6ce756938f8c1
        matchKeys:
          - HASHED_EMAIL_SHA_256
          - HASHED_PHONE_SHA_256
        schedule:
          startAtEpochMillis: 1756200000000
          endAtEpochMillis: 1788021405297
          frequency: DAILY
    Activation:
      type: object
      properties:
        activationId:
          type: string
          description: The activation's unique identifier.
        status:
          type: string
          description: The activation record's status, not the result of an individual export run.
          enum:
            - ACTIVE
            - FAILED
            - EXPIRED
            - ARCHIVED
            - DELETED
        destinationDataConnectionId:
          type: string
          description: The destination data connection's unique identifier.
        audiences:
          type: array
          description: The audience IDs included in the activation.
          items:
            type: string
        matchKeys:
          type: array
          description: The match keys used by the activation.
          items:
            type: string
        fieldMappings:
          type: array
          description: Field mappings used to export audience data.
          items:
            $ref: "#/components/schemas/DatasetField"
        schedule:
          $ref: "#/components/schemas/ActivationSchedule"
        createdAtEpochMillis:
          type: integer
          format: int64
          description: The creation timestamp in milliseconds since the Unix epoch.
        updatedAtEpochMillis:
          type: integer
          format: int64
          description: The last update timestamp in milliseconds since the Unix epoch.
        createdBy:
          type: string
          description: The identity that created the activation.
        updatedBy:
          type: string
          description: The identity that last updated the activation.
      example:
        activationId: 6758a9a4aaf36004110fd5f5
        status: ACTIVE
        destinationDataConnectionId: 6a727838f3fe382e2f6ab527
        audiences:
          - 6a6cbe4dc6a6ce756938f8b2
          - 6a6cbe4dc6a6ce756938f8c1
        matchKeys:
          - HASHED_EMAIL_SHA_256
          - HASHED_PHONE_SHA_256
        schedule:
          startAtEpochMillis: 1756200000000
          endAtEpochMillis: 1788021405297
          frequency: DAILY
        createdAtEpochMillis: 1787848605297
        updatedAtEpochMillis: 1787848605297
        createdBy: adobe_user
        updatedBy: adobe_user
        fieldMappings: []
    ActivationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activation"
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        limit:
          type: integer
      example:
        items:
          - activationId: 6758a9a4aaf36004110fd5f5
            status: ACTIVE
            destinationDataConnectionId: 6a727838f3fe382e2f6ab527
            audiences:
              - 6a6cbe4dc6a6ce756938f8b2
            matchKeys:
              - HASHED_EMAIL_SHA_256
        next: null
        previous: null
        limit: 20
    DatasetField:
      type: object
      properties:
        sourceName:
          type: string
        targetName:
          type: string
        matchKey:
          type: boolean
        sourceType:
          type: string
        sourceDataType:
          type: string
        transformation:
          type: object
          additionalProperties: true
        relationships:
          type: array
          items:
            type: object
            additionalProperties: true
    Error:
      type: object
      description: The error response details.
      properties:
        type:
          type: string
          format: uri
          description: The error type URI.
        title:
          type: string
          description: A short description of the error.
        status:
          type: integer
          description: The HTTP status code.
        report:
          type: object
          properties:
            tenantInfo:
              type: object
              properties:
                sandboxName:
                  type: string
                sandboxId:
                  type: string
                imsOrgId:
                  type: string
            additionalContext:
              type: object
              properties:
                detailed-message:
                  type: string
                message:
                  type: string
                request-id:
                  type: string
                  description: The request identifier supplied in the error response.
        error-chain:
          type: array
          items:
            type: object
            properties:
              serviceId:
                type: string
              errorCode:
                type: string
              invokingServiceId:
                type: string
              unixTimeStampMs:
                type: integer
                format: int64
