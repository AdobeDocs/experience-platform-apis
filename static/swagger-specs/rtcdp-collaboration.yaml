        status:
          type: string
        imsOrg:
          type: string
        createdAtEpochMillis:
          type: integer
          format: int64
        updatedAtEpochMillis:
          type: integer
          format: int64
        createdBy:
          type: string
        ownerCollaboratorId:
          type: string
        updatedBy:
          type: string
        version:
          type: string
        collaboratorId:
          type: string
        entityType:
          type: string
        dataconnectionId:
          type: string
        properties:
          type: object
          description: Audience-specific entity properties.
          additionalProperties: true
        executionStats:
          type: object
          description: Execution statistics for the audience.
          additionalProperties: true
