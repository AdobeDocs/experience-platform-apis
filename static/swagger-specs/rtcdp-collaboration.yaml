          format: int64
          description: The estimated number of records matching the expression for this match key.
        expression:
          type: string
          description: The resolved expression returned by the service as a JSON string.
      example:
        matchKey: HASHED_EMAIL_SHA_256
        recordCount: 1000
        expression: '{"operation":"INTERSECT","operands":[{"value":{"collaboratorId":"col_nike","audienceId":"aud_loyalty"}},{"value":{"collaboratorId":"col_nike","audienceId":"aud_clickers"}}]}'
    CreateCompositionRequest:
