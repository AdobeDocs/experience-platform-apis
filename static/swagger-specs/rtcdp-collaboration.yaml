          $ref: "#/components/schemas/GrantReceiver"
        receiverRight:
          $ref: "#/components/schemas/GrantReceiverRight"
        grantedAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
    AudienceReference:
      type: object
      properties:
        collaboratorId:
          type: string
          description: The audience owner's collaborator ID.
        audienceId:
          type: string
          description: The audience's unique identifier.
    AudienceExpressionLeaf:
      type: object
      required:
        - value
      properties:
        value:
          $ref: "#/components/schemas/AudienceReference"
    SetExpression:
      type: object
      description: A set-algebra operation over audience leaves or nested expressions. Maximum depth is 32.
      required:
        - operation
        - operands
      properties:
        operation:
          type: string
          description: The set-algebra operator.
          example: INTERSECT
        operands:
          type: array
          description: Audience leaves or nested set-algebra expressions.
          items:
            oneOf:
              - $ref: "#/components/schemas/AudienceExpressionLeaf"
              - $ref: "#/components/schemas/SetExpression"
      example:
        operation: INTERSECT
        operands:
