        platformSettings:
          type: object
          properties:
            type:
              type: string
        campaignMetadata:
          type: object
          additionalProperties: true
        visibility:
          type: string
        hasBetaBadge:
          type: boolean
        isComingSoon:
          type: boolean
        inheritedFrom:
          type: object
          properties:
