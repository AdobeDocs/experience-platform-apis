openapi: 3.0.1
info:
  title: Real-Time CDP Collaboration API
  description: |
    Use the Real-Time CDP Collaboration API to integrate external applications with Real-Time CDP Collaboration.

    - **Related documentation**:
        - [Real-Time CDP Collaboration documentation](https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/home)

    All requests require an Adobe.io server-to-server OAuth bearer token, `x-api-key`, and `x-gw-ims-org-id`. Set `Accept` to `application/vnd.adobe.collaboration+json; version=1`. Requests with a body use `Content-Type: application/json`, including grant updates.
  version: "1.0.0"

servers:
  - url: https://{environment}.adobe.io/collaboration/metadata
    variables:
      environment:
        default: platform
        enum:
          - platform
          - platform-stage

tags:
  - name: Collaborators
    description: Create and manage collaborators in Real-Time CDP Collaboration.
  - name: Brands
    description: Create and list brands under a parent collaborator.
  - name: Audiences
    description: Discover and delete audiences owned by or visible to a collaborator.
  - name: Evaluations
    description: Evaluate audience expressions without creating a new audience.
  - name: Compositions
    description: Materialize an audience expression as a new composed audience.
  - name: Grants
    description: Share audiences with another collaborator under a controlled scope.
  - name: Activations
    description: Activate owned or granted audiences to a downstream destination.

security:
  - bearerAuth: []

paths:
  /collaborators:
    post:
      tags:
        - Collaborators
      summary: Create a collaborator
      description: |
        Creates a collaborator. The request body is the same for both formats. Set `Accept` to `application/vnd.adobe.collaboration+json; version=1` to receive the trimmed external representation.
      operationId: createCollaborator
      parameters:
        - $ref: "#/components/parameters/x-api-key"
        - $ref: "#/components/parameters/x-gw-ims-org-id"
        - $ref: "#/components/parameters/accept"
        - $ref: "#/components/parameters/x-request-id"
      requestBody:
        description: The collaborator to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollaboratorRequest"
            examples:
              advertiser:
                summary: Create an advertiser collaborator
                value:
                  id: 9a986bcc469d5772a22d
                  name: Acme Shoes
                  description: Acme Shoes, Inc is an American athletic footwear and apparel corporation headquartered near Beaverton, Oregon, United States. It is the world's largest supplier of athletic shoes and apparel and a major manufacturer of sports equipment, with revenue in excess of US$46 billion in its fiscal year 2022.
                  imsOrg: abcd1234@AdobeOrg
                  type: ADVERTISER
                  region: US
                  useCases:
                    - AUDIENCE_SHARING
                    - AUDIENCE_INSIGHTS
                    - AUDIENCE_ACTIVATION
                    - AUDIENCE_EXPANSION
                    - MEASUREMENT
                  industry: CTV
                  matchKeys:
                    - LIVERAMP_ID
                    - HASHED_EMAIL_SHA_256
                  matchKeySettings:
                    - id: LIVERAMP_ID
                      minimumCount: 50000
                    - id: HASHED_EMAIL_SHA_256
                      minimumCount: 50000
                  logoImage: "data:image/svg+xml;base64,"
                  headerImage: "key:ui:acme"
              publisher:
                summary: Create a publisher collaborator
                value:
                  id: 10186bcc469d5772a113
                  name: Some Publisher
                  description: Some Publisher
                  imsOrg: efdc8876@AdobeOrg
                  type: PUBLISHER
                  region: US
                  useCases:
                    - AUDIENCE_SHARING
                    - AUDIENCE_INSIGHTS
                    - AUDIENCE_ACTIVATION
                    - AUDIENCE_EXPANSION
                    - MEASUREMENT
                  industry: CTV
                  matchKeys:
                    - LIVERAMP_ID
                    - HASHED_EMAIL_SHA_256
                  matchKeySettings:
                    - id: LIVERAMP_ID
                      minimumCount: 5000
                    - id: HASHED_EMAIL_SHA_256
                      minimumCount: 50000
                  logoImage: "data:image/svg+xml;base64,"
                  headerImage: "key:ui:abcu"
                  consentedForPublicDiscovery: true
      responses:
        "201":
          x-summary: Collaborator created
          description: The collaborator was created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCollaboratorRequest"
              examples:
                advertiser:
                  summary: Created advertiser collaborator
                  value:
                    id: 9a986bcc469d5772a22d
                    name: Acme Shoes
                    description: Acme Shoes, Inc is an American athletic footwear and apparel corporation headquartered near Beaverton, Oregon, United States. It is the world's largest supplier of athletic shoes and apparel and a major manufacturer of sports equipment, with revenue in excess of US$46 billion in its fiscal year 2022.
                    imsOrg: abcd1234@AdobeOrg
                    type: ADVERTISER
                    region: US
                    useCases:
                      - AUDIENCE_SHARING
                      - AUDIENCE_INSIGHTS
                      - AUDIENCE_ACTIVATION
                      - AUDIENCE_EXPANSION
                      - MEASUREMENT
                    industry: CTV
                    matchKeys:
                      - LIVERAMP_ID
                      - HASHED_EMAIL_SHA_256
                    matchKeySettings:
                      - id: LIVERAMP_ID
                        minimumCount: 50000
                      - id: HASHED_EMAIL_SHA_256
                        minimumCount: 50000
                    logoImage: "data:image/svg+xml;base64,"
                    headerImage: "key:ui:acme"
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Collaborator"
              examples:
                publisher:
                  summary: Created publisher collaborator
                  value:
                    id: 6a90679d08cb6303653d7f38
                    name: Example publisher
                    description: A publisher collaborating on audiences.
                    type: PUBLISHER
                    useCases:
                      - AUDIENCE_INSIGHTS
                      - AUDIENCE_SHARING
                      - AUDIENCE_ACTIVATION
                      - MEASUREMENT
                    matchKeySettings:
                      - id: HASHED_EMAIL_SHA_256
                        minimumCount: 10000
                      - id: HASHED_PHONE_SHA_256
                        minimumCount: 10000
                    status: ACTIVE
                    imsOrg: 1234567890ABCDEF12345678@AdobeOrg
                    createdAtEpochMillis: 1787848605297
                    updatedAtEpochMillis: 1787848605297

  /collaborators/{id}:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Collaborators
      summary: Get a collaborator
      description: |
        Returns a collaborator. The response format is selected by the `Accept` header. `application/json` (the default) returns the full collaborator. `application/vnd.adobe.collaboration+json; version=1` returns the trimmed external representation with `id`, `name`, `description`, `type`, `useCases`, `matchKeySettings`, `status`, `imsOrg`, `createdAt`, and `updatedAt`.
      operationId: getCollaborator
      responses:
        "200":
          x-summary: Collaborator retrieved
          description: Collaborator found.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Collaborator"
              example:
                id: 9a986bcc469d5772a22d
                name: Acme Shoes
                description: Acme Shoes, Inc is an American athletic footwear and apparel corporation headquartered near Beaverton, Oregon, United States. It is the world's largest supplier of athletic shoes and apparel and a major manufacturer of sports equipment, with revenue in excess of US$46 billion in its fiscal year 2022.
                imsOrg: abcd1234@AdobeOrg
                type: ADVERTISER
                region: US
                useCases:
                  - AUDIENCE_SHARING
                  - AUDIENCE_INSIGHTS
                  - AUDIENCE_ACTIVATION
                  - AUDIENCE_EXPANSION
                  - MEASUREMENT
                industry: CTV
                matchKeys:
                  - LIVERAMP_ID
                  - HASHED_EMAIL_SHA_256
                matchKeySettings:
                  - id: LIVERAMP_ID
                    minimumCount: 50000
                  - id: HASHED_EMAIL_SHA_256
                    minimumCount: 50000
                logoImage: "data:image/svg+xml;base64,"
                headerImage: "key:ui:acme"
        "404":
          x-summary: Collaborator not found
          description: Collaborator not found.

  /collaborators/{id}/brands:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Brands
      summary: List brands
      description: Lists brands created by the parent collaborator.
      operationId: getBrands
      parameters:
        - name: status
          in: query
          description: Filter by brand status.
          schema:
            type: string
            example: ACTIVE
        - name: cursor
          in: query
          description: The opaque `next` cursor returned by the previous page.
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          x-summary: Brands retrieved
          description: A page of brand records.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/BrandList"
              example:
                items:
                  - id: string
                    name: string
                    description: string
                    parentCollaboratorId: string
                    status: string
                    type: string
                    useCases:
                      - string
                    matchKeySettings:
                      - id: string
                        minimumCount: 0
                        settings: {}
                    imsOrg: string
                    createdAt: 0
                    updatedAt: 0
                next: string
                previous: string
                limit: 0
        "404":
          x-summary: Parent collaborator not found
          description: The parent collaborator ID is unknown.
    post:
      tags:
        - Brands
      summary: Create a brand
      description: |
        Creates a brand (child collaborator) under the parent collaborator `id`. The request body is a collaborator payload. Set `Accept` to `application/vnd.adobe.collaboration+json; version=1` to receive the trimmed brand representation.
      operationId: createBrand
      requestBody:
        description: The brand to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollaboratorRequest"
            example:
              id: 9a986bcc469d5772a22d
              name: Acme Shoes
              description: Acme Shoes, Inc is an American athletic footwear and apparel corporation headquartered near Beaverton, Oregon, United States. It is the world's largest supplier of athletic shoes and apparel and a major manufacturer of sports equipment, with revenue in excess of US$46 billion in its fiscal year 2022.
              imsOrg: abcd1234@AdobeOrg
              type: ADVERTISER
              region: US
              useCases:
                - AUDIENCE_SHARING
                - AUDIENCE_INSIGHTS
                - AUDIENCE_ACTIVATION
                - AUDIENCE_EXPANSION
                - MEASUREMENT
              industry: CTV
              matchKeys:
                - LIVERAMP_ID
                - HASHED_EMAIL_SHA_256
              matchKeySettings:
                - id: LIVERAMP_ID
                  minimumCount: 50000
                - id: HASHED_EMAIL_SHA_256
                  minimumCount: 50000
              logoImage: "data:image/svg+xml;base64,"
              headerImage: "key:ui:acme"
      responses:
        "201":
          x-summary: Brand created
          description: The created brand record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Brand"
              example:
                id: string
                name: string
                description: string
                parentCollaboratorId: string
                status: string
                type: string
                useCases:
                  - string
                matchKeySettings:
                  - id: string
                    minimumCount: 0
                    settings: {}
                imsOrg: string
                createdAt: 0
                updatedAt: 0

  /collaborators/{collaboratorId}/audiences:
    parameters:
      - $ref: "#/components/parameters/scopedCollaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Audiences
      summary: List audiences
      description: |
        Lists audiences for the collaborator with cursor pagination. `view` selects `sourced` (the default, owned by the collaborator), `received` (shared with the collaborator, optionally filtered by `connectionId` or `senderCollaboratorId`), or `all`; unrecognized values fall back to `sourced`. Other filters are `sourceType`, `status`, `matchKey`, and `name`. Sort with `orderBy` (`createdAt` by default or `updatedAt`) and `sort`. Use the `next` or `previous` cursor from the previous page, but not both. `limit` is 1 to 100 (default 20).
      operationId: getAudiences
      parameters:
        - name: sourceType
          in: query
          description: Filter by audience source type.
          schema:
            type: string
            example: AEP_RTCDP
        - name: view
          in: query
          description: Select owned, received, or all audiences. Defaults to `sourced`.
          schema:
            type: string
            enum:
              - sourced
              - received
              - all
            default: sourced
        - name: connectionId
          in: query
          description: Filter received audiences by connection ID.
          schema:
            type: string
        - name: senderCollaboratorId
          in: query
          description: Filter received audiences by sender collaborator ID.
          schema:
            type: string
        - name: status
          in: query
          description: Filter audiences by status.
          schema:
            type: string
        - name: matchKey
          in: query
          description: Filter audiences by match key.
          schema:
            type: string
        - name: name
          in: query
          description: Filter audiences by name.
          schema:
            type: string
        - name: orderBy
          in: query
          description: The field to order by (`createdAt` or `updatedAt`).
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
            default: createdAt
        - name: sort
          in: query
          description: The sort direction.
          schema:
            type: string
        - name: next
          in: query
          description: The cursor for the next page.
          schema:
            type: string
        - name: previous
          in: query
          description: The cursor for the previous page.
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          x-summary: Audiences retrieved
          description: Page of audiences.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/AudienceList"
              example:
                items:
                  - id: string
                    collaboratorId: string
                    collaboratorName: string
                    imsOrgId: string
                    name: string
                    description: string
                    sourceType: string
                    categories:
                      - string
                    subCategories:
                      - string
                    matchKeys:
                      - matchKey: string
                        identityCount: 0
                    status: string
                    createdAt: 0
                    updatedAt: 0
                    type: AUDIENCE
                    grantInfo:
                      grantId: string
                      receiver:
                        collaboratorId: string
                        imsOrgId: string
                      receiverRight: QUERY
                      grantedAt: 0
                      expiresAt: 0
                next: string
                previous: string
                limit: 0
        "400":
          x-summary: Invalid audience query
          description: An invalid filter, `orderBy`, `sourceType`, or `matchKey` value was supplied, or both `next` and `previous` were supplied.

  /collaborators/{collaboratorId}/audiences/{audienceId}:
    parameters:
      - $ref: "#/components/parameters/scopedCollaboratorId"
      - $ref: "#/components/parameters/audienceId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Audiences
      summary: Get an audience
      description: Returns a single audience by ID, including grant metadata for the collaborator.
      operationId: getAudience
      responses:
        "200":
          x-summary: Audience retrieved
          description: Audience found.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Audience"
              example:
                id: string
                collaboratorId: string
                collaboratorName: string
                imsOrgId: string
                name: string
                description: string
                sourceType: string
                categories:
                  - string
                subCategories:
                  - string
                matchKeys:
                  - matchKey: string
                    identityCount: 0
                status: string
                createdAt: 0
                updatedAt: 0
                type: AUDIENCE
                grantInfo:
                  grantId: string
                  receiver:
                    collaboratorId: string
                    imsOrgId: string
                  receiverRight: QUERY
                  grantedAt: 0
                  expiresAt: 0
        "404":
          x-summary: Audience not found
          description: Audience not found.
    delete:
      tags:
        - Audiences
      summary: Delete an audience
      description: Deletes an audience by ID. Only entities of type audience can be deleted through this endpoint.
      operationId: deleteAudience
      responses:
        "204":
          x-summary: Audience deleted
          description: Audience deleted.
        "404":
          x-summary: Audience not found
          description: Audience not found.

  /collaborators/{collaboratorId}/audiences/evaluations:
    parameters:
      - $ref: "#/components/parameters/scopedCollaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Evaluations
      summary: Evaluate audiences
      description: |
        Evaluates the single audience expression in the request body for the collaborator. The response contains one result per requested match key, each with the `recordCount` for that match key. It is not a per-audience breakdown of the expression.
      operationId: evaluateAudiences
      requestBody:
        description: The expression and match key filters to evaluate.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateAudiencesRequest"
            example:
              filters:
                matchKeys:
                  - MERKURY_ID
              expression:
                operation: string
                operands:
                  - string
                value:
                  collaboratorId: string
                  entityId: string
                  entityType: AUDIENCE
      responses:
        "200":
          x-summary: Expression evaluated
          description: Evaluation results.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationResult"
              example:
                - matchKey: MERKURY_ID
                  recordCount: 0
                  expression: string

  /collaborators/{collaboratorId}/audiences/compositions:
    parameters:
      - $ref: "#/components/parameters/scopedCollaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Compositions
      summary: Compose an audience
      description: |
        Creates a new audience for the collaborator by composing it from the definition in the request body, and returns the created audience.
      operationId: composeAudience
      requestBody:
        description: The composed audience's metadata, expression, and match key filters.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompositionRequest"
            example:
              name: string
              description: string
              ownerCollaboratorId: string
              filters:
                matchKeys:
                  - MERKURY_ID
              expression:
                operation: string
                operands:
                  - string
                value:
                  collaboratorId: string
                  entityId: string
                  entityType: AUDIENCE
      responses:
        "201":
          x-summary: Composed audience created
          description: Audience created.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/ComposedAudience"
              example:
                id: string
                name: string
                description: string
                status: DRAFT
                imsOrg: string
                createdAtEpochMillis: 0
                updatedAtEpochMillis: 0
                createdBy: string
                ownerCollaboratorId: string
                updatedBy: string
                version: string
                collaboratorId: string
                entityType: AUDIENCE
                dataconnectionId: string
                properties: {}
                executionStats:
                  status: SUCCEEDED
                  message: string
                  processedAtEpochMillis: 0
                  metrics:
                    - matchKey: MERKURY_ID
                      identityCount: 0
                  system: {}
                  outputPath: string

  /collaborators/{collaboratorId}/grants:
    parameters:
      - $ref: "#/components/parameters/scopedCollaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Grants
      summary: Create grants
      description: Creates one or more grants from the collaborator to the receiver collaborator named in `receiverDetails`, and returns the created grants.
      operationId: createGrants
      requestBody:
        description: The receiver collaborator and one or more grant records to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
            example:
              receiverDetails:
                collaboratorId: string
                imsOrgId: string
              grants:
                - audienceId: string
                  population: OVERLAP
                  receiverRight: QUERY
                  sourceMode: REFERENCE
                  expiresAt: 0
      responses:
        "201":
          x-summary: Grants created
          description: The created grants.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
              example:
                - grantId: string
                  status: ACTIVE
                  collaboratorId: string
                  imsOrgId: string
                  createdAt: 0
                  updatedAt: 0
                  createdBy: string
                  updatedBy: string
                  grantType: AUDIENCE_GRANT
                  scope: CONNECTION
                  audienceId: string
                  receiverDetails:
                    collaboratorId: string
                    imsOrgId: string
                  population: OVERLAP
                  receiverRight: QUERY
                  sourceMode: REFERENCE
                  expiresAt: 0
    patch:
      tags:
        - Grants
      summary: Patch grants
      description: Updates one or more existing grants of the collaborator as described in the request body, and returns the updated grants.
      operationId: patchGrants
      requestBody:
        description: The grants to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantPatchRequest"
            example:
              - op: add
                value: {}
      responses:
        "200":
          x-summary: Grants updated
          description: The updated grants.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grant"
              example:
                - grantId: string
                  status: ACTIVE
                  collaboratorId: string
                  imsOrgId: string
                  createdAt: 0
                  updatedAt: 0
                  createdBy: string
                  updatedBy: string
                  grantType: AUDIENCE_GRANT
                  scope: CONNECTION
                  audienceId: string
                  receiverDetails:
                    collaboratorId: string
                    imsOrgId: string
                  population: OVERLAP
                  receiverRight: QUERY
                  sourceMode: REFERENCE
                  expiresAt: 0
    get:
      tags:
        - Grants
      summary: List grants
      description: Lists grants of the collaborator with cursor pagination. Filter by `role` (`all` or empty returns every role) and `connectionId`. Sort with `orderBy` and `sort`, and page with `limit` plus the `next` or `previous` cursor.
      operationId: getGrants
      parameters:
        - name: orderBy
          in: query
          description: The field to order by.
          schema:
            type: string
        - name: sort
          in: query
          description: The sort direction.
          schema:
            type: string
        - name: role
          in: query
          description: Filter by grant role. `all` or an empty value returns every role.
          schema:
            type: string
        - name: connectionId
          in: query
          description: Filter by connection ID.
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - name: next
          in: query
          description: The cursor for the next page.
          schema:
            type: string
        - name: previous
          in: query
          description: The cursor for the previous page.
          schema:
            type: string
      responses:
        "200":
          x-summary: Grants retrieved
          description: A page of grants.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/GrantList"
              example:
                items:
                  - grantId: string
                    status: ACTIVE
                    collaboratorId: string
                    imsOrgId: string
                    createdAt: 0
                    updatedAt: 0
                    createdBy: string
                    updatedBy: string
                    grantType: AUDIENCE_GRANT
                    scope: CONNECTION
                    audienceId: string
                    receiverDetails:
                      collaboratorId: string
                      imsOrgId: string
                    population: OVERLAP
                    receiverRight: QUERY
                    sourceMode: REFERENCE
                    expiresAt: 0
                next: string
                previous: string
                limit: 0

  /collaborators/{collaboratorId}/grants/{id}:
    parameters:
      - $ref: "#/components/parameters/scopedCollaboratorId"
      - $ref: "#/components/parameters/grantId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Grants
      summary: Get a grant
      description: Returns a single grant of the collaborator by ID.
      operationId: getGrantById
      responses:
        "200":
          x-summary: Grant retrieved
          description: Grant found.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Grant"
              example:
                grantId: string
                status: ACTIVE
                collaboratorId: string
                imsOrgId: string
                createdAt: 0
                updatedAt: 0
                createdBy: string
                updatedBy: string
                grantType: AUDIENCE_GRANT
                scope: CONNECTION
                audienceId: string
                receiverDetails:
                  collaboratorId: string
                  imsOrgId: string
                population: OVERLAP
                receiverRight: QUERY
                sourceMode: REFERENCE
                expiresAt: 0

  /collaborators/{collaboratorId}/activations:
    parameters:
      - $ref: "#/components/parameters/scopedCollaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Activations
      summary: Create an activation
      description: |
        Creates an activation that sends the audiences in the request body to the destination data connection, and returns the created activation. The response `Content-Type` follows the `Accept` header: `application/json` or `application/vnd.adobe.collaboration+json; version=1`.
      operationId: createActivation
      requestBody:
        description: The destination data connection, audiences, match keys, and schedule.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivationRequest"
            example:
              destinationDataConnectionId: string
              audiences:
                - string
              matchKeys:
                - MERKURY_ID
              schedule:
                startAtEpochMillis: 0
                endAtEpochMillis: 0
                frequency: ONCE
      responses:
        "201":
          x-summary: Activation created
          description: Activation created.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Activation"
              example:
                activationId: string
                status: DRAFT
                destinationDataConnectionId: string
                audiences:
                  - string
                matchKeys:
                  - MERKURY_ID
                fieldMappings:
                  - sourceName: string
                    targetName: string
                    matchKey: true
                    sourceType: AEP_NAMESPACE
                    sourceDataType: string
                    transformation:
                      functions:
                        - type: SHA_256
                    relationships:
                      - type: ACTIVATION_MAPPING
                        target: string
                schedule:
                  startAtEpochMillis: 0
                  endAtEpochMillis: 0
                  frequency: ONCE
                createdAtEpochMillis: 0
                updatedAtEpochMillis: 0
                createdBy: string
                updatedBy: string
    get:
      tags:
        - Activations
      summary: List activations
      description: |
        Lists activations of the collaborator with cursor pagination. Sort with `orderBy` and `sort`, and page with `limit` plus the `next` or `previous` cursor. The response `Content-Type` follows the `Accept` header: `application/json` or `application/vnd.adobe.collaboration+json; version=1`.
      operationId: listActivations
      parameters:
        - name: orderBy
          in: query
          description: The field to order by.
          schema:
            type: string
        - name: sort
          in: query
          description: The sort direction.
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - name: next
          in: query
          description: The cursor for the next page.
          schema:
            type: string
        - name: previous
          in: query
          description: The cursor for the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of activations.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/ActivationList"
              example:
                items:
                  - activationId: string
                    status: DRAFT
                    destinationDataConnectionId: string
                    audiences:
                      - string
                    matchKeys:
                      - MERKURY_ID
                    fieldMappings:
                      - sourceName: string
                        targetName: string
                        matchKey: true
                        sourceType: AEP_NAMESPACE
                        sourceDataType: string
                        transformation:
                          functions:
                            - type: SHA_256
                        relationships:
                          - type: ACTIVATION_MAPPING
                            target: string
                    schedule:
                      startAtEpochMillis: 0
                      endAtEpochMillis: 0
                      frequency: ONCE
                    createdAtEpochMillis: 0
                    updatedAtEpochMillis: 0
                    createdBy: string
                    updatedBy: string
                next: string
                previous: string
                limit: 0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An Adobe.io server-to-server OAuth access token.
  parameters:
    x-api-key:
      name: x-api-key
      in: header
      description: "The API key which can be copied from your Experience Platform integration. For more information on how to obtain this value, visit the [authentication tutorial](http://www.adobe.com/go/platform-api-authentication-en)."
      required: true
      schema:
        type: string
    x-gw-ims-org-id:
      name: x-gw-ims-org-id
      in: header
      description: The caller's IMS organization ID, which identifies the tenant.
      required: true
      schema:
        type: string
    accept:
      name: Accept
      in: header
      description: Selects version 1 of the external Collaboration API contract.
      required: true
      schema:
        type: string
        enum:
          - "application/vnd.adobe.collaboration+json; version=1"
    x-request-id:
      name: X-Request-Id
      in: header
      description: An optional request identifier, echoed back for tracing.
      required: false
      schema:
        type: string
    collaboratorId:
      name: id
      in: path
      description: The collaborator's unique identifier. For brand operations, this identifies the parent collaborator.
      required: true
      schema:
        type: string
      example: col_dsg_root
    scopedCollaboratorId:
      name: collaboratorId
      in: path
      description: The collaborator's unique identifier.
      required: true
      schema:
        type: string
      example: col_dsg_root
    audienceId:
      name: audienceId
      in: path
      description: The audience's unique identifier.
      required: true
      schema:
        type: string
      example: aud_loyalty
    grantId:
      name: id
      in: path
      description: The grant's unique identifier.
      required: true
      schema:
        type: string
      example: grant_12345
    limit:
      name: limit
      in: query
      description: The number of records to request (1 to 100, default 20).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  responses:
    ValidationFailed:
      x-summary: Validation failed
      description: "A field is missing or invalid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidRequest:
              $ref: "#/components/examples/InvalidRequest"
    Unauthenticated:
      x-summary: Authentication failed
      description: "The access token is missing or invalid."
    Forbidden:
      x-summary: Access forbidden
      description: "The caller is not entitled to perform this operation or is attempting unauthorized cross-organization access."
    ExpressionInvalid:
      x-summary: Invalid audience expression
      description: "The expression exceeds depth 32, has the wrong operand count, uses an unknown operator, contains a cross-collaborator leaf, or is missing a match key."
    RateLimited:
      x-summary: Rate limit exceeded
      description: "The per-tenant quota was exceeded. Retry according to the Retry-After header."
    InternalError:
      x-summary: Internal server error
      description: "A server-side failure occurred. Retry with backoff."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internalError:
              $ref: "#/components/examples/InternalError"
  examples:
    InvalidRequest:
      summary: Invalid request
      value:
        type: https://ns.adobe.com/aep/errors/ACPS-1001-400
        title: Invalid request
        status: 400
        report:
          tenantInfo:
            sandboxName: N/A
            sandboxId: N/A
            imsOrgId: 1234567890ABCDEF12345678@AdobeOrg
          additionalContext:
            detailed-message: The supplied match key is not supported.
            message: The request is invalid.
            request-id: rZnWWlnGgLlV5u3CeZBMjj9Y
        error-chain:
          - serviceId: ACPS
            errorCode: ACPS-1001-400
            invokingServiceId: N/A
            unixTimeStampMs: 1787078021305
    InternalError:
      summary: Internal server error
      value:
        type: https://ns.adobe.com/aep/errors/ACPS-1005-500
        title: Internal error
        status: 500
        report:
          tenantInfo:
            sandboxName: N/A
            sandboxId: N/A
            imsOrgId: 1234567890ABCDEF12345678@AdobeOrg
          additionalContext:
            detailed-message: AgoraDB evaluate failed with status Failed.
            message: An internal error has occurred. Please try again. If the problem persists, please contact customer support.
            request-id: K7aSlcfs0gE85WVo3medR1a2
        error-chain:
          - serviceId: ACPS
            errorCode: ACPS-1005-500
            invokingServiceId: N/A
            unixTimeStampMs: 1787075028920
  schemas:
    CreateCollaboratorRequest:
      type: object
      properties:
        id:
          type: string
          description: The collaborator's identifier.
        name:
          type: string
          description: The collaborator's name.
        description:
          type: string
          description: A description of the collaborator.
        status:
          type: string
          description: The collaborator's status.
        imsOrg:
          type: string
          description: The collaborator's IMS organization ID.
        createdAtEpochMillis:
          type: integer
          format: int64
        updatedAtEpochMillis:
          type: integer
          format: int64
        createdBy:
          type: string
        ownerCollaboratorId:
          type: string
        updatedBy:
          type: string
        version:
          type: string
        type:
          type: string
          description: The collaborator type.
          example: PUBLISHER
        region:
          type: string
          description: The collaborator's region.
        useCases:
          type: array
          description: The collaboration use cases.
          items:
            type: string
          example:
            - AUDIENCE_INSIGHTS
            - AUDIENCE_SHARING
            - AUDIENCE_ACTIVATION
            - MEASUREMENT
        industry:
          type: string
          description: The collaborator's industry.
        matchKeys:
          type: array
          deprecated: true
          items:
            type: string
        matchKeySettings:
          type: array
          description: Match key settings for the collaborator.
          items:
            $ref: "#/components/schemas/MatchKeySetting"
        logoImage:
          type: string
        headerImage:
          type: string
        consentedForPublicDiscovery:
          type: boolean
        collaboratorGroup:
          type: string
        contactEmail:
          type: string
        collaboratorUseCaseSettings:
          type: object
          properties:
