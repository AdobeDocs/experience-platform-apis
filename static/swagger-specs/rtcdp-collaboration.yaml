        id: 6a92271cf779b04f7e2a702a
        name: Loyal Clickers
        description: Loyalty holders who also clicked recent ads.
        status: QUEUED
        entityType: AUDIENCE
        collaboratorId: col_nike
        imsOrg: 1234567890ABCDEF12345678@AdobeOrg
        createdAtEpochMillis: 1787963164777
        updatedAtEpochMillis: 1787963164777
        properties:
          sourceType: COMPOSED
          categories: []
    GrantPopulation:
      type: string
      description: The population shared by the grant.
      enum:
        - OVERLAP
        - FULL
        - DELTA
    GrantReceiverRight:
      type: string
      description: The receiver's access right.
      enum:
        - QUERY
        - OWNED
    GrantSourceMode:
      type: string
      description: The grant's source mode.
      enum:
        - REFERENCE
    GrantExpiry:
      type: integer
      format: int64
      description: The grant expiry value. Zero means no expiry.
      example: 0
    GrantReceiver:
      type: object
      properties:
        collaboratorId:
          type: string
          description: The receiver's collaborator ID.
        imsOrgId:
          type: string
          description: The receiver's IMS organization ID.
    CreateGrantRequest:
      type: object
      properties:
        receiverDetails:
          $ref: "#/components/schemas/GrantReceiver"
        grants:
          type: array
          description: The grants to create.
          items:
            $ref: "#/components/schemas/GrantInfo"
    GrantInfo:
      type: object
      properties:
        audienceId:
          type: string
          description: The audience to share.
        population:
          $ref: "#/components/schemas/GrantPopulation"
        receiverRight:
          $ref: "#/components/schemas/GrantReceiverRight"
        sourceMode:
          $ref: "#/components/schemas/GrantSourceMode"
        expiresAt:
          $ref: "#/components/schemas/GrantExpiry"
      example:
        receiverDetails:
