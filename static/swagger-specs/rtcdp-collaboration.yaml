openapi: 3.0.1
info:
  title: Real-Time CDP Collaboration API
  description: |
    Use the Real-Time CDP Collaboration API to integrate external applications with Real-Time CDP Collaboration.

    - **Related documentation**:
        - [Real-Time CDP Collaboration documentation](https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/home)

    All requests require an Adobe.io server-to-server OAuth bearer token, `x-api-key`, and `x-gw-ims-org-id`. Set `Accept` to `application/vnd.adobe.collaboration+json; version=1`. Requests with a body use `Content-Type: application/json`, including grant updates.
  version: "1.0.0"

servers:
  - url: https://{environment}.adobe.io/collaboration/metadata
    variables:
      environment:
        default: platform
        enum:
          - platform
          - platform-stage

tags:
  - name: Collaborators
    description: Create and manage collaborators in Real-Time CDP Collaboration.
  - name: Brands
    description: Create and list brands under a parent collaborator.
  - name: Audiences
    description: Discover and delete audiences owned by or visible to a collaborator.
  - name: Evaluations
    description: Evaluate audience expressions without creating a new audience.
  - name: Compositions
    description: Materialize an audience expression as a new composed audience.
  - name: Grants
    description: Share audiences with another collaborator under a controlled scope.
  - name: Activations
    description: Activate owned or granted audiences to a downstream destination.

security:
  - bearerAuth: []

paths:
  /collaborators:
    post:
      tags:
        - Collaborators
      summary: Create a collaborator
      description: Creates a collaborator and returns the created record.
      operationId: createCollaborator
      parameters:
        - $ref: "#/components/parameters/x-api-key"
        - $ref: "#/components/parameters/x-gw-ims-org-id"
        - $ref: "#/components/parameters/accept"
        - $ref: "#/components/parameters/x-request-id"
      requestBody:
        description: The collaborator to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollaboratorRequest"
            examples:
              publisher:
                summary: Create a publisher collaborator
                value:
                  name: Example publisher
                  description: A publisher collaborating on audiences.
                  type: PUBLISHER
                  useCases:
                    - AUDIENCE_INSIGHTS
                    - AUDIENCE_SHARING
                    - AUDIENCE_ACTIVATION
                    - MEASUREMENT
                  matchKeySettings:
                    - id: HASHED_EMAIL_SHA_256
                      minimumCount: 10000
                    - id: HASHED_PHONE_SHA_256
                      minimumCount: 10000
      responses:
        "201":
          x-summary: Collaborator created
          description: The collaborator was created successfully.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Collaborator"
              examples:
                publisher:
                  summary: Created publisher collaborator
                  value:
                    id: 6a90679d08cb6303653d7f38
                    name: Example publisher
                    description: A publisher collaborating on audiences.
                    type: PUBLISHER
                    useCases:
                      - AUDIENCE_INSIGHTS
                      - AUDIENCE_SHARING
                      - AUDIENCE_ACTIVATION
                      - MEASUREMENT
                    matchKeySettings:
                      - id: HASHED_EMAIL_SHA_256
                        minimumCount: 10000
                      - id: HASHED_PHONE_SHA_256
                        minimumCount: 10000
                    status: ACTIVE
                    imsOrg: 1234567890ABCDEF12345678@AdobeOrg
                    createdAtEpochMillis: 1787848605297
                    updatedAtEpochMillis: 1787848605297
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Collaborators
      summary: Retrieve a collaborator
      description: Retrieves a collaborator by ID.
      operationId: getCollaborator
      responses:
        "200":
          x-summary: Collaborator retrieved
          description: The collaborator record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Collaborator"
        "404":
          x-summary: Collaborator not found
          description: The collaborator ID is unknown or the caller is not authorized to access it.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/brands:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Brands
      summary: List brands
      description: Lists brands created by the parent collaborator.
      operationId: listBrands
      parameters:
        - name: status
          in: query
          description: Filter by brand status.
          schema:
            type: string
            example: ACTIVE
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          x-summary: Brands retrieved
          description: A page of brand records.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/BrandList"
        "404":
          x-summary: Parent collaborator not found
          description: The parent collaborator ID is unknown.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Brands
      summary: Create a brand
      description: |
        Creates a brand under the parent collaborator. Use cases and match key settings are inherited from the parent retail media network (RMN) when omitted.
      operationId: createBrand
      requestBody:
        description: The brand to create.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandRequest"
      responses:
        "201":
          x-summary: Brand created
          description: The created brand record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/audiences:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Audiences
      summary: List audiences
      description: Lists audiences owned by or visible to the collaborator.
      operationId: listAudiences
      parameters:
        - name: sourceType
          in: query
          description: Filter by audience source type.
          schema:
            type: string
            example: RAW
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          x-summary: Audiences retrieved
          description: A page of audience records.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/AudienceList"
        "404":
          x-summary: Collaborator not found
          description: The collaborator ID is unknown.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/audiences/{audienceId}:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/audienceId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Audiences
      summary: Retrieve an audience
      description: Retrieves a single audience.
      operationId: getAudience
      responses:
        "200":
          x-summary: Audience retrieved
          description: The audience record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Audience"
        "404":
          x-summary: Audience not found
          description: The audience ID is unknown.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Audiences
      summary: Delete an audience
      description: |
        Deletes an audience owned by the collaborator. Deleting a composed audience also marks its linked composition as `DELETED`.

        Deletion is refused if an active composition or grant references the audience.
      operationId: deleteAudience
      responses:
        "204":
          x-summary: Audience deleted
          description: The audience was deleted. The response has no body.
        "404":
          x-summary: Audience not found
          description: The audience ID is unknown.
        "409":
          x-summary: Audience has active dependencies
          description: "CONFLICT_CASCADE: An active composition or grant references the audience."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/audiences/evaluations:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Evaluations
      summary: Evaluate an audience expression
      description: |
        Computes overlap for an audience set-algebra expression without materializing a new audience. Returns an array containing one result per match key.

        Expressions deeper than 32 levels, incorrect operand counts, unknown operators, cross-collaborator leaves, and missing match keys produce `EXPRESSION_INVALID`.
      operationId: evaluateAudiences
      requestBody:
        description: The expression and match key filters to evaluate.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateAudiencesRequest"
      responses:
        "200":
          x-summary: Expression evaluated
          description: One evaluation result per match key.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationResult"
        "400":
          $ref: "#/components/responses/ExpressionInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/audiences/compositions:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Compositions
      summary: Create a composed audience
      description: |
        Creates a new composed audience by combining existing audiences using a set-algebra expression. Returns the created audience record.

        The same expression validation rules as audience evaluations apply.
      operationId: createAudienceComposition
      requestBody:
        description: The composed audience's metadata, expression, and match key filters.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompositionRequest"
      responses:
        "201":
          x-summary: Composed audience created
          description: The created composed audience record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/ComposedAudience"
        "400":
          $ref: "#/components/responses/ExpressionInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/grants:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Grants
      summary: Create an audience grant
      description: Shares an audience with another collaborator under a controlled scope. The path identifies the sender.
      operationId: createGrant
      requestBody:
        description: The audience, receiver, access rights, and expiry for the grant.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
      responses:
        "201":
          x-summary: Grant created
          description: The created grant record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Grant"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          x-summary: Audience or receiver not found
          description: The audience or receiver collaborator is unknown.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags:
        - Grants
      summary: List issued grants
      description: Lists grants issued by the collaborator. Supports ordering, sorting, and cursor pagination.
      operationId: listGrants
      parameters:
        - name: orderBy
          in: query
          description: The field to order by.
          schema:
            type: string
        - name: sort
          in: query
          description: The sort direction.
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - name: nextCursor
          in: query
          description: The continuation token returned in the previous response.
          schema:
            type: string
      responses:
        "200":
          x-summary: Grants retrieved
          description: A page of issued grants and a continuation token.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/GrantList"
        "404":
          x-summary: Collaborator not found
          description: The collaborator ID is unknown.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/grantId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Grants
      summary: Retrieve a grant
      description: Retrieves a grant by ID.
      operationId: getGrant
      responses:
        "200":
          x-summary: Grant retrieved
          description: The grant record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Grant"
        "404":
          x-summary: Grant not found
          description: The grant ID is unknown or the caller is not authorized to access it.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Grants
      summary: Update a grant
      description: |
        Updates mutable fields using JSON Patch `replace` operations only. The patchable fields are `population`, `receiverRight`, `sourceMode`, and `expiresAt`. Only the grant owner can update the grant.

      operationId: updateGrant
      requestBody:
        description: An array of replace operations for mutable grant fields.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GrantPatchOperation"
            example:
              - op: replace
                path: /population
                value: FULL
      responses:
        "200":
          x-summary: Grant updated
          description: The updated grant record.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Grant"
        "400":
          x-summary: Invalid grant update
          description: "VALIDATION_FAILED: The patch modifies an immutable field or contains an invalid JSON Patch operation."
        "403":
          x-summary: Caller is not the grant owner
          description: "FORBIDDEN: Only the grant owner can update this grant."
        "404":
          x-summary: Grant not found
          description: The grant ID is unknown.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/activations:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    post:
      tags:
        - Activations
      summary: Create an activation
      description: |
        Create an activation for the collaborator. The record is created synchronously with status: `ACTIVE`; the downstream push runs async on the schedule and each run's results are recorded on a child activation run (linked by `activationId`).

        The owning collaborator is taken from the path.

        Each audience in the request carries only `audienceId` — the backend resolves the owning `collaboratorId`/`imsOrgId` and, for virtual-access audiences, the `connectionId` whose grant permits access.
      operationId: createActivation
      requestBody:
        description: The destination data connection, audiences, match keys, and schedule.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivationRequest"
      responses:
        "201":
          x-summary: Activation created
          description: The created activation record with status ACTIVE. Scheduled run results are not included.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Activation"
        "400":
          x-summary: Invalid activation request
          description: "VALIDATION_FAILED: A field is missing or invalid, the audience set or match keys are empty, or the destination is not ACTIVE or is not an egress connection."
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          x-summary: No active grant permits activation
          description: "FORBIDDEN: No active grant permits the caller to activate a virtual-access audience."
        "404":
          x-summary: Activation dependency not found
          description: The destination data connection, audience, or connection is unknown.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /collaborators/{id}/activations/{activationId}:
    parameters:
      - $ref: "#/components/parameters/collaboratorId"
      - $ref: "#/components/parameters/activationId"
      - $ref: "#/components/parameters/x-api-key"
      - $ref: "#/components/parameters/x-gw-ims-org-id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/x-request-id"
    get:
      tags:
        - Activations
      summary: Retrieve an activation
      description: Retrieves the activation record. Per-run materialization and export results are read separately from child activation runs linked by activationId, not inline in this response.
      operationId: getActivation
      responses:
        "200":
          x-summary: Activation retrieved
          description: The activation record without per-run results.
          content:
            application/vnd.adobe.collaboration+json; version=1:
              schema:
                $ref: "#/components/schemas/Activation"
        "404":
          x-summary: Activation not found
          description: The activation ID is unknown, the activation is deleted, or the caller is not authorized to access it.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An Adobe.io server-to-server OAuth access token.
  parameters:
    x-api-key:
      name: x-api-key
      in: header
      description: "The API key which can be copied from your Experience Platform integration. For more information on how to obtain this value, visit the [authentication tutorial](http://www.adobe.com/go/platform-api-authentication-en)."
      required: true
      schema:
        type: string
    x-gw-ims-org-id:
      name: x-gw-ims-org-id
      in: header
      description: The caller's IMS organization ID, which identifies the tenant.
      required: true
      schema:
        type: string
    accept:
      name: Accept
      in: header
      description: Selects version 1 of the external Collaboration API contract.
      required: true
      schema:
        type: string
        enum:
          - "application/vnd.adobe.collaboration+json; version=1"
    x-request-id:
      name: X-Request-Id
      in: header
      description: An optional request identifier, echoed back for tracing.
      required: false
      schema:
        type: string
        format: uuid
    collaboratorId:
      name: id
      in: path
      description: The collaborator's unique identifier. For brand operations, this identifies the parent collaborator.
      required: true
      schema:
        type: string
      example: col_dsg_root
    audienceId:
      name: audienceId
      in: path
      description: The audience's unique identifier.
      required: true
      schema:
        type: string
      example: aud_loyalty
    grantId:
      name: grantId
      in: path
      description: The grant's unique identifier.
      required: true
      schema:
        type: string
      example: grant_12345
    activationId:
      name: activationId
      in: path
      description: The activation's unique identifier.
      required: true
      schema:
        type: string
      example: 6758a9a4aaf36004110fd5f5
    limit:
      name: limit
      in: query
      description: The number of records to request.
      schema:
        type: integer
      example: 20
  responses:
    ValidationFailed:
      x-summary: Validation failed
      description: "A field is missing or invalid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidRequest:
              $ref: "#/components/examples/InvalidRequest"
    Unauthenticated:
      x-summary: Authentication failed
      description: "The access token is missing or invalid."
    Forbidden:
      x-summary: Access forbidden
      description: "The caller is not entitled to perform this operation or is attempting unauthorized cross-organization access."
    ExpressionInvalid:
      x-summary: Invalid audience expression
      description: "The expression exceeds depth 32, has the wrong operand count, uses an unknown operator, contains a cross-collaborator leaf, or is missing a match key."
    RateLimited:
      x-summary: Rate limit exceeded
      description: "The per-tenant quota was exceeded. Retry according to the Retry-After header."
    InternalError:
      x-summary: Internal server error
      description: "A server-side failure occurred. Retry with backoff."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internalError:
              $ref: "#/components/examples/InternalError"
  examples:
    InvalidRequest:
      summary: Invalid request
      value:
        type: https://ns.adobe.com/aep/errors/ACPS-1001-400
        title: Invalid request
        status: 400
        report:
          tenantInfo:
            sandboxName: N/A
            sandboxId: N/A
            imsOrgId: 1234567890ABCDEF12345678@AdobeOrg
          additionalContext:
            detailed-message: The supplied match key is not supported.
            message: The request is invalid.
            request-id: rZnWWlnGgLlV5u3CeZBMjj9Y
        error-chain:
          - serviceId: ACPS
            errorCode: ACPS-1001-400
            invokingServiceId: N/A
            unixTimeStampMs: 1787078021305
    InternalError:
      summary: Internal server error
      value:
        type: https://ns.adobe.com/aep/errors/ACPS-1005-500
        title: Internal error
        status: 500
        report:
          tenantInfo:
            sandboxName: N/A
            sandboxId: N/A
            imsOrgId: 1234567890ABCDEF12345678@AdobeOrg
          additionalContext:
            detailed-message: AgoraDB evaluate failed with status Failed.
            message: An internal error has occurred. Please try again. If the problem persists, please contact customer support.
            request-id: K7aSlcfs0gE85WVo3medR1a2
        error-chain:
          - serviceId: ACPS
            errorCode: ACPS-1005-500
            invokingServiceId: N/A
            unixTimeStampMs: 1787075028920
  schemas:
    CreateCollaboratorRequest:
      type: object
      properties:
        name:
          type: string
          description: The collaborator's name.
        description:
          type: string
          description: A description of the collaborator.
        type:
          type: string
          description: The collaborator type.
          example: PUBLISHER
        useCases:
          type: array
          description: The collaboration use cases.
          items:
            type: string
          example:
